name: Build ESP32 Firmware

on:
  push:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and esptool
        run: |
          python -m pip install --upgrade pip
          pip install platformio esptool

      - name: Build Firmware
        run: |
          pio run -e esp32s3

      - name: Create Merged Binary
        run: |
          mkdir -p output
          # دمج الملفات: bootloader @ 0x0، partition table @ 0x8000، التطبيق @ 0x10000
          esptool.py --chip esp32s3 merge_bin \
            -o output/merged.bin \
            --flash_mode dio \
            --flash_size 16MB \
            0x0 .pio/build/esp32s3/bootloader.bin \
            0x8000 .pio/build/esp32s3/partitions.bin \
            0x10000 .pio/build/esp32s3/firmware.bin

      - name: Upload Merged Firmware
        uses: actions/upload-artifact@v4
        with:
          name: merged-firmware
          path: output/merged.bin
